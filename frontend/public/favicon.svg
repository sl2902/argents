<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Picture frame: rounded square outline representing art/canvas -->
  <rect x="3" y="3" width="26" height="26" rx="4" ry="4"
        fill="none" stroke="#4f46e5" stroke-width="3"/>
  <!-- Four agent dots at inner corners representing the multi-agent pipeline -->
  <circle cx="10" cy="10" r="2.5" fill="#4f46e5"/>
  <circle cx="22" cy="10" r="2.5" fill="#4f46e5"/>
  <circle cx="10" cy="22" r="2.5" fill="#4f46e5"/>
  <circle cx="22" cy="22" r="2.5" fill="#4f46e5"/>
  <!-- Two crossing arcs in center: dual-agent debate/contrast concept -->
  <path d="M12 16 C14 13, 18 13, 20 16" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M12 16 C14 19, 18 19, 20 16" stroke="#4f46e5" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
